name: 诊断

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install --no-deps rapidocr_onnxruntime==1.4.4
          pip list
      - run: python tools/ocr_check.py
