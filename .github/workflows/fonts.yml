name: fonts

# 生成「字体包」：免费开源 / 免费商用字体，精简到常用汉字 + 英文 + 标点，放到 models-v1 里，软件第一次改字时下载
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下载字体
        run: |
          pip install --quiet fonttools brotli
          mkdir -p src out
          for i in 1 2 3; do gh release download -R adobe-fonts/source-han-sans -p "SourceHanSansSC.zip" -D src --clobber && break; sleep 5; done || true
          gh release download -R adobe-fonts/source-han-serif -p "09_SourceHanSerifSC.zip" -D src || true
          try() { echo "== $1"; curl -fL --retry 2 -o "$2" "$1" && ls -la "$2" || { echo "FAIL $1"; rm -f "$2"; }; }
          # 阿里巴巴普惠体 3.0、阿里妈妈字体（免费商用）：从 AUR 的打包脚本里找官方下载地址
          for pkg in ttf-alibabasans-puhuiti3-fonts ttf-alimama-shuheiti ttf-alimama-fangyuanti ttf-alimama-dongfangdakai ttf-alimama-daoliti otf-alimama-shuheiti; do
            echo "== PKGBUILD $pkg"
            curl -fsL -A "Mozilla/5.0" "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=$pkg" -o "pk_$pkg" || { echo "FAIL pkgbuild $pkg"; continue; }
            grep -iE "^(source|_url|url|pkgver)" "pk_$pkg" | head -8
            python - "$pkg" <<'PY'
          import re, sys, subprocess
          pkg = sys.argv[1]
          t = open(f"pk_{pkg}", encoding="utf-8", errors="ignore").read()
          ver = re.search(r"^pkgver=(\S+)", t, re.M)
          urls = re.findall(r"https?://[^\s'\")]+\.(?:zip|ttf|otf|7z)", t)
          for u in urls:
              u = u.replace("${pkgver}", ver.group(1) if ver else "").replace("$pkgver", ver.group(1) if ver else "")
              out = "src/" + pkg + "_" + u.rsplit("/", 1)[-1]
              r = subprocess.run(["curl", "-fL", "--retry", "2", "-A", "Mozilla/5.0", "-o", out, u])
              print(("OK " if r.returncode == 0 else "FAIL ") + u)
          PY
          done
          ls -la src
          cd src && for z in *.zip; do unzip -oq "$z" -d "${z%.zip}" || true; done && cd ..
          find src \( -iname "*.otf" -o -iname "*.ttf" \) | grep -v -i "HW\|__MACOSX\|/web/\|woff" | sort > list.txt
          cat list.txt
      - name: 精简（GB2312 常用汉字 + 英文 + 标点）
        run: |
          python - <<'PY'
          import os, subprocess
          chars = set()
          for b1 in range(0xB0, 0xF8):
              for b2 in range(0xA1, 0xFF):
                  try:
                      chars.add(bytes([b1, b2]).decode("gb2312"))
                  except Exception:
                      pass
          extra = "".join(chr(c) for c in range(0x20, 0x7F)) + "，。、；：？！“”‘’（）【】《》〈〉「」『』…—～·￥％＋－×÷＝＜＞｛｝｜＃＠＆＊°℃①②③④⑤⑥⑦⑧⑨⑩★☆●○◆◇■□▲△♡♥√✓✔※→←↑↓"
          chars |= set(extra)
          chars |= {chr(c) for c in range(0xFF01, 0xFF5F)}
          open("chars.txt", "w", encoding="utf-8").write("".join(sorted(chars)))
          print("chars", len(chars))
          for line in open("list.txt", encoding="utf-8"):
              src = line.strip()
              if not src:
                  continue
              name = os.path.splitext(os.path.basename(src))[0]
              dst = f"out/{name}.otf" if src.lower().endswith(".otf") else f"out/{name}.ttf"
              r = subprocess.run(["pyftsubset", src, "--text-file=chars.txt", f"--output-file={dst}",
                                  "--layout-features=*", "--name-IDs=*", "--name-languages=*", "--no-hinting"],
                                 capture_output=True, text=True)
              print(name, os.path.getsize(dst) if os.path.exists(dst) else r.stderr[-200:])
          PY
          ls -la out && du -sh out
          cd out && zip -q ../fonts.zip * && cd .. && ls -la fonts.zip && sha256sum fonts.zip
      - name: 上传
        run: gh release upload models-v1 fonts.zip -R ${{ github.repository }} --clobber
