name: fonts

# 生成「字体包」：免费开源 / 免费商用字体，精简到常用汉字 + 英文 + 标点，放到 models-v1 里，软件第一次改字时下载
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 下载字体
        run: |
          pip install --quiet fonttools brotli
          mkdir -p src out
          # 思源黑体：资源名每个版本不一样，列出来按名字挑简体中文的
          gh api repos/adobe-fonts/source-han-sans/releases/latest -q '.assets[].name' | tee sans_assets.txt
          A=$(grep -iE "^(SubsetOTF_CN|.*SourceHanSansSC)\.zip$" sans_assets.txt | grep -viE "HW|VF|Mono" | head -1)
          [ -z "$A" ] && A=$(grep -iE "SC.*\.zip$|CN.*\.zip$" sans_assets.txt | grep -viE "HW|VF|Mono|ttc" | head -1)
          echo "sans asset: $A"
          [ -n "$A" ] && gh release download -R adobe-fonts/source-han-sans -p "$A" -D src || echo "FAIL sans"
          gh release download -R adobe-fonts/source-han-serif -p "09_SourceHanSerifSC.zip" -D src || true
          # 阿里巴巴普惠体、阿里妈妈字体（免费商用）：官方 OSS 下载不了时，用 npm 上别人打好的包
          for u in https://puhuiti.oss-cn-hangzhou.aliyuncs.com/AlibabaPuHuiTi-3/AlibabaPuHuiTi-3.zip; do
            curl -sS -o /dev/null -w "oss %{http_code}\n" -A "Mozilla/5.0" "$u" || true
          done
          npm search --json --searchlimit=40 alibaba puhuiti > s1.json || true
          npm search --json --searchlimit=40 alimama font > s2.json || true
          npm search --json --searchlimit=40 "@fontpkg" > s3.json || true
          python - <<'PY2'
          import json, re, subprocess, os
          names = set()
          for f in ("s1.json", "s2.json", "s3.json"):
              try:
                  for x in json.load(open(f)):
                      names.add(x["name"])
              except Exception as e:
                  print("search fail", f, e)
          names = sorted(n for n in names if re.search(r"puhuiti|pu-hui-ti|alimama|ali-ma-ma", n, re.I))
          print("candidates:", names)
          os.makedirs("npm", exist_ok=True)
          for n in names:
              r = subprocess.run(["npm", "pack", n, "--pack-destination", "npm"], capture_output=True, text=True)
              print(("OK " if r.returncode == 0 else "FAIL ") + n, r.stdout.strip()[-80:], r.stderr.strip()[-120:])
          PY2
          ls -la npm || true
          cd npm && for t in *.tgz; do mkdir -p "../src/npm_${t%.tgz}" && tar -xzf "$t" -C "../src/npm_${t%.tgz}"; done; cd ..
          ls -la src
          cd src && for z in *.zip; do unzip -oq "$z" -d "${z%.zip}" || true; done && cd ..
          find src \( -iname "*.otf" -o -iname "*.ttf" -o -iname "*.woff2" \) | grep -viE "HW|__MACOSX|Mono|PuHuiTi-2-|RegularL3|VF|/web/" | sort > all.txt
          # 同一个字体有 otf/ttf/woff2 多份时只留一份（优先 otf > ttf > woff2）
          python - <<'PY2'
          import os
          best = {}
          rank = {".otf": 0, ".ttf": 1, ".woff2": 2}
          for l in open("all.txt"):
              p = l.strip()
              stem, ext = os.path.splitext(os.path.basename(p))
              k = stem.lower()
              if k not in best or rank[ext.lower()] < rank[os.path.splitext(best[k])[1].lower()]:
                  best[k] = p
          open("list.txt", "w").write("\n".join(sorted(best.values())) + "\n")
          PY2
          cat list.txt
      - name: 精简（GB2312 常用汉字 + 英文 + 标点）
        run: |
          python - <<'PY'
          import os, subprocess
          chars = set()
          for b1 in range(0xB0, 0xF8):
              for b2 in range(0xA1, 0xFF):
                  try:
                      chars.add(bytes([b1, b2]).decode("gb2312"))
                  except Exception:
                      pass
          extra = "".join(chr(c) for c in range(0x20, 0x7F)) + "，。、；：？！“”‘’（）【】《》〈〉「」『』…—～·￥％＋－×÷＝＜＞｛｝｜＃＠＆＊°℃①②③④⑤⑥⑦⑧⑨⑩★☆●○◆◇■□▲△♡♥√✓✔※→←↑↓"
          chars |= set(extra)
          chars |= {chr(c) for c in range(0xFF01, 0xFF5F)}
          open("chars.txt", "w", encoding="utf-8").write("".join(sorted(chars)))
          print("chars", len(chars))
          for line in open("list.txt", encoding="utf-8"):
              src = line.strip()
              if not src:
                  continue
              name = os.path.splitext(os.path.basename(src))[0]
              dst = f"out/{name}.otf" if src.lower().endswith(".otf") else f"out/{name}.ttf"
              r = subprocess.run(["pyftsubset", src, "--text-file=chars.txt", f"--output-file={dst}",
                                  "--layout-features=*", "--name-IDs=*", "--name-languages=*", "--no-hinting"],
                                 capture_output=True, text=True)
              print(name, os.path.getsize(dst) if os.path.exists(dst) else r.stderr[-200:])
          PY
          ls -la out && du -sh out
          cd out && zip -q ../fonts.zip * && cd .. && ls -la fonts.zip && sha256sum fonts.zip
      - name: 上传
        run: gh release upload models-v1 fonts.zip -R ${{ github.repository }} --clobber
