name: models

# 生成「首次使用时下载」的识别模型，放到 models-v1 预发布里（不是软件版本）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成版面分析模型（PP-DocLayoutV2，矩阵乘法量化成 int8）
        run: |
          pip install --quiet rapid-layout onnxruntime==1.19.2 onnx
          python - <<'PY'
          import glob, os, hashlib
          from rapid_layout import RapidLayout, RapidLayoutInput, ModelType
          RapidLayout(cfg=RapidLayoutInput(model_type=ModelType.PP_DOC_LAYOUTV2))
          import rapid_layout
          src = glob.glob(os.path.dirname(rapid_layout.__file__) + "/models/pp_doc_layoutv2.onnx")[0]
          from onnxruntime.quantization import quantize_dynamic, QuantType
          quantize_dynamic(src, "layout.onnx", weight_type=QuantType.QInt8, op_types_to_quantize=["MatMul", "Gemm"])
          h = hashlib.sha256(open("layout.onnx", "rb").read()).hexdigest()
          print("LAYOUT", os.path.getsize("layout.onnx"), h)
          PY
      - name: 上传
        run: gh release upload models-v1 layout.onnx -R ${{ github.repository }} --clobber
