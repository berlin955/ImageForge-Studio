name: 构建与发布

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.0.1（留空则用代码里的版本号）"
        required: false
        default: ""
      publish:
        description: "发布为正式版本（软件会提示用户更新）"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 版本号
        shell: pwsh
        run: |
          $inputV = "${{ github.event.inputs.version }}".Trim().TrimStart("v")
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
            python tools/set_version.py $v
          } elseif ($inputV) {
            $v = $inputV
            python tools/set_version.py $v
          } else {
            $v = (python tools/get_version.py).Trim()
          }
          $publish = ("${{ github.ref_type }}" -eq "tag") -or ("${{ github.event.inputs.publish }}" -eq "true")
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUBLISH=$publish" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version $v"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          pip install --no-deps rapidocr_onnxruntime==1.4.4

      - name: 准备识别模型和图标
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/fetch_model.py
          python tools/make_icon.py
          mkdir preview -Force | Out-Null
          python tools/render_icons.py preview/nav_icons_preview.png

      - name: 下载高精度识别模型（640m）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ok = $false
          try {
            gh release download v3.4-weights -R notAI-tech/NudeNet -p 640m.onnx -D models --clobber
            if ((Test-Path models\640m.onnx) -and (Get-Item models\640m.onnx).Length -gt 5MB) { $ok = $true }
          } catch { Write-Host "gh download failed: $_" }
          if (-not $ok) {
            foreach ($u in @("https://github.com/notAI-tech/NudeNet/releases/download/v3.4-weights/640m.onnx",
                             "https://huggingface.co/alexgenovese/checkpoint/resolve/main/640m.onnx")) {
              try {
                Invoke-WebRequest $u -OutFile models\640m.onnx -MaximumRedirection 10
                if ((Get-Item models\640m.onnx).Length -gt 5MB) { $ok = $true; break }
              } catch { Write-Host "download failed: $u $_" }
            }
          }
          if ($ok) { Write-Host ("640m model: " + (Get-Item models\640m.onnx).Length + " bytes") }
          else { Remove-Item models\640m.onnx -ErrorAction SilentlyContinue; Write-Host "::warning::640m model not available, using 320n" }

      - name: 自检（源码）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python app/main.py --selftest

      - name: 打包 exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name MaskForge `
            --icon assets/icon.ico `
            --add-data "models;models" `
            --add-data "assets;assets" `
            --paths app `
            --collect-binaries onnxruntime `
            --collect-all rapidocr_onnxruntime `
            --exclude-module tkinter `
            app/main.py

      - name: 自检（打包后的 exe）
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $log = Join-Path $PWD "selftest-exe.log"
          $p = Start-Process -FilePath "dist\MaskForge\MaskForge.exe" -ArgumentList "--selftest","--selftest-log",$log -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Encoding utf8 } else { Write-Host "no log" }
          if ($p.ExitCode -ne 0) { Write-Error "exe selftest failed: $($p.ExitCode)"; exit 1 }

      - name: 制作安装程序
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            foreach ($c in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "ISCC: $iscc"
          $innoDir = Split-Path $iscc
          $isl = @("$innoDir\Languages\ChineseSimplified.isl", "$innoDir\Languages\Unofficial\ChineseSimplified.isl") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isl) {
            try {
              Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "installer\ChineseSimplified.isl"
              $isl = (Resolve-Path "installer\ChineseSimplified.isl").Path
            } catch { Write-Host "Chinese language file not available, using English" }
          }
          $isccArgs = @("/DMyAppVersion=$env:APP_VERSION")
          if ($isl) { $isccArgs += "/DChineseIsl=$isl"; Write-Host "language: $isl" }
          & $iscc @isccArgs "installer\MaskForge.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path "dist\MaskForge\*" -DestinationPath "dist-installer\ImageForge-Studio-Portable-$env:APP_VERSION.zip"
          Get-ChildItem dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview/*
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ImageForge-Studio-${{ env.APP_VERSION }}
          path: dist-installer/*
          retention-days: 14

      - name: 发布 Release
        if: env.PUBLISH == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py $env:APP_VERSION notes.md dist-installer
          python tools/latest_json.py $env:APP_VERSION notes.md dist-installer
          $files = (Get-ChildItem dist-installer\*).FullName
          $tag = "v$env:APP_VERSION"
          $done = $false
          for ($i = 1; $i -le 4 -and -not $done; $i++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $files --clobber
            } else {
              gh release create $tag $files --target "${{ github.sha }}" --title "智图工坊 v$env:APP_VERSION" --notes-file notes.md
            }
            if ($LASTEXITCODE -eq 0) { $done = $true } else { Write-Host "release attempt $i failed, retrying"; Start-Sleep -Seconds (15 * $i) }
          }
          if (-not $done) { exit 1 }
